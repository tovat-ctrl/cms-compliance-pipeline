name: CMS Compliance Pipeline

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    name: Extract, validate, and report
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python -m etl.run_pipeline

      - name: Commit compliance artifacts
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore(pipeline): automated CMS compliance run"
          file_pattern: reports/
